name: Create Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: create-release
  cancel-in-progress: false
jobs:
  create:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview or create release from commits
        id: semantic
        uses: cycjimmy/semantic-release-action@v8
        with:
          dry_run: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Dispatch macOS distribution for the published release
        if: github.event_name == 'workflow_dispatch' && steps.semantic.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.semantic.outputs.new_release_git_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          # GITHUB_TOKEN-created tags do not trigger push workflows.
          gh workflow run macos-release.yml --repo "$REPOSITORY" --ref "$VERSION"

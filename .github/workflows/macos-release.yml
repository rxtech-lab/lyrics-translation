name: macOS Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      resolve_public_key_only:
        description: 'Derive the existing signing key public key without building or releasing'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  public-key:
    if: github.event_name == 'workflow_dispatch' && inputs.resolve_public_key_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 -m pip install cryptography
      - name: Derive public key
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_KEY }}
        run: python3 scripts/ci/resolve-sparkle-key.py
      - name: Export public key
        run: printf '%s\n' "$SPARKLE_PUBLIC_KEY" > sparkle-public-key.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sparkle-public-key
          path: sparkle-public-key.txt
          retention-days: 1
  release:
    if: ${{ !inputs.resolve_public_key_only }}
    runs-on: macos-26
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
      BUILD_NUMBER: ${{ github.run_number }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY || secrets.SPARKLE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rxtech-lab/RxAgentSDK
          token: ${{ secrets.RELEASE_TOKEN }}
          path: dependencies/RxAgentSDK
      - uses: actions/checkout@v4
        with:
          repository: rxtech-lab/film-workflow
          token: ${{ secrets.RELEASE_TOKEN }}
          path: dependencies/film-workflow
      - name: Configure CI package paths
        run: |
          sed -i '' 's|../rxlab/|dependencies/|g' project.yml
      - name: Validate release configuration
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_KEY }}
        run: |
          [[ "$GITHUB_REF" == refs/tags/* && "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test -n "$SPARKLE_KEY" || { echo '::error::SPARKLE_KEY signing secret is required'; exit 1; }
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 -m pip install cryptography markdown
      - run: python3 scripts/ci/test_resolve_sparkle_key.py
      - name: Resolve and validate Sparkle public key
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_KEY }}
        run: python3 scripts/ci/resolve-sparkle-key.py
      - run: python3 scripts/ci/test_validate_appcast.py
      - uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
      - name: Install provisioning profile
        env:
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Associated Domains (passkeys) requires a Developer ID profile on the app target.
          PROFILE_NAME=$(bash scripts/ci/install-provisioning-profile.sh MACOS_PROVISIONING_PROFILE_BASE64)
          echo "LYRICSTUDIO_PROVISIONING_PROFILE=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Validate signing identity against provisioning profile
        run: |
          python3 scripts/ci/test_resolve_signing_identity.py
          python3 scripts/ci/resolve-signing-identity.py "$RUNNER_TEMP/MACOS_PROVISIONING_PROFILE_BASE64.plist"
      - name: Archive and sign
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -project LyricStudio.xcodeproj -scheme LyricStudio -configuration Release -destination 'generic/platform=macOS' -archivePath output/output.xcarchive -derivedDataPath output/DerivedData CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$SIGNING_CERTIFICATE_NAME" LYRICSTUDIO_PROVISIONING_PROFILE="$LYRICSTUDIO_PROVISIONING_PROFILE" OTHER_CODE_SIGN_FLAGS='--options=runtime --timestamp' ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO MARKETING_VERSION="${VERSION#v}" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" SPARKLE_PUBLIC_KEY="$SPARKLE_PUBLIC_KEY" archive
          bash scripts/ci/sign-sparkle.sh
      - name: Package and notarize
        run: bash scripts/ci/notary.sh
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PWD: ${{ secrets.APPLE_ID_PWD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Prepare release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$VERSION" >/dev/null 2>&1 || gh release create "$VERSION" --verify-tag --generate-notes --title "LyricStudio $VERSION"
          gh release view "$VERSION" --json body --jq .body > output/release-notes.md
      - name: Generate and verify signed feed
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_KEY }}
        run: |
          RELEASE_NOTE="$(cat output/release-notes.md)"
          export RELEASE_NOTE
          bash scripts/ci/generate-appcast.sh
      - name: Upload DMG to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$VERSION" LyricStudio.dmg --clobber
          gh release edit "$VERSION" --draft=false
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/pages
  deploy:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

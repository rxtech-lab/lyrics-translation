name: LyricStudio
options:
  bundleIdPrefix: app.rxlab
  deploymentTarget:
    macOS: '26.0'
packages:
  RxRemotion:
    path: ../rxlab/film-workflow/Packages/RxRemotion
  RxAgentSDK:
    path: ../rxlab/RxAgentSDK
targets:
  LyricStudio:
    type: application
    platform: macOS
    sources:
      - path: Lyrics
      - path: icon.icon
        buildPhase: resources
    dependencies:
      - target: LyricPreview
        embed: true
      - target: LyricThumbnail
        embed: true
      - package: RxRemotion
        product: RxRemotion
      - package: RxRemotion
        product: RxRemotionUI
      - package: RxAgentSDK
    settings:
      base:
        SWIFT_VERSION: '6.0'
        ASSETCATALOG_COMPILER_APPICON_NAME: icon
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.rxlab.LyricStudio
        CODE_SIGN_ENTITLEMENTS: Lyrics/App.entitlements
    info:
      path: Lyrics/Info.plist
      properties:
        NSAppleMusicUsageDescription: Lyric Studio plays the Apple Music recording of your song so you can time karaoke subtitles word by word.
        NSSpeechRecognitionUsageDescription: Lyric Studio listens to your copy of the recording on this Mac to detect when each lyric word is sung.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Lyric Translation
            CFBundleTypeRole: Editor
            CFBundleTypeIconFile: LyricDocument
            LSHandlerRank: Owner
            LSItemContentTypes: [app.rxlab.lyric-document]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.rxlab.lyric-document
            UTTypeConformsTo: [public.data, public.content]
            UTTypeDescription: Lyric Translation
            UTTypeIconFile: LyricDocument.icns
            UTTypeTagSpecification:
              public.filename-extension: [lyricstudio]
  LyricPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLook/Shared
      - path: QuickLook/Preview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rxlab.LyricStudio.LyricPreview
        SWIFT_VERSION: '6.0'
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
    info:
      path: QuickLook/Preview/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: [app.rxlab.lyric-document]
  LyricThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLook/Shared
      - path: QuickLook/Thumbnail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rxlab.LyricStudio.LyricThumbnail
        SWIFT_VERSION: '6.0'
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
    info:
      path: QuickLook/Thumbnail/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [app.rxlab.lyric-document]
            QLThumbnailMinimumDimension: 0
